info:
  productName: "SquarePad"
  productIdentifier: "com.squarepad.app"
  productVersion: "1.0.0"
  companyName: ""
  description: "Add padding to images without cropping"
  copyright: ""
  comments: "Built with Wails"
  version: "1.0.0"
  appicon: "build/appicon.png"

dev_mode:
  root_path: .
  executes:
    - cmd: cd frontend && npm install
      type: once
    - cmd: cd frontend && npm run dev
      type: background
    - cmd: go run .
      type: primary
