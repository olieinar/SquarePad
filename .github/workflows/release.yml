name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      APP_VERSION: ${{ github.ref_name }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Wails v3 CLI
        shell: pwsh
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.24

      - name: Build Windows executable
        shell: pwsh
        run: wails3 task build APP_VERSION=$($env:GITHUB_REF_NAME -replace '^v', '')

      - name: Create checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash bin/SquarePad.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  SquarePad-windows-amd64.exe" | Out-File -FilePath SHA256SUMS -Encoding ascii
          Rename-Item bin/SquarePad.exe SquarePad-windows-amd64.exe

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            bin/SquarePad-windows-amd64.exe
            SHA256SUMS
